<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Elemental Battle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;800&family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
:root {
  --bg:#e3ebe5; --panel:#f4f8f5; --ink:#1b2a24; --muted:#56675f; --line:#b9c9bf;
  --hp:#2f9e5a; --hp-low:#d8342c; --shield:#3b6fd8; --gold:#c8960c;
  --dmg:#c0332b; --def:#3b6fd8; --sup:#1f8a4c;
  --wood:#2f8a4c; --fire:#d8342c; --earth:#efc419; --wind:#a9d6e5; --water:#1f3a5f;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#14201b; --panel:#1d2b25; --ink:#e8f0ea; --muted:#a3b5ab; --line:#34463d; --shield:#7d97ff; --def:#7d97ff; --dmg:#ff7b70; --sup:#5ccf8c; --gold:#f0c348; --water:#2d5a8f; }
}
:root[data-theme="dark"]{ --bg:#14201b; --panel:#1d2b25; --ink:#e8f0ea; --muted:#a3b5ab; --line:#34463d; --shield:#7d97ff; --def:#7d97ff; --dmg:#ff7b70; --sup:#5ccf8c; --gold:#f0c348; --water:#2d5a8f; }
*,*::before,*::after{ box-sizing:inherit; }
html{ scroll-padding-top:env(safe-area-inset-top,0px); }
body{ margin:0; background:var(--bg); color:var(--ink); font-family:"Lexend",system-ui,-apple-system,"Segoe UI",sans-serif; font-size:16px; line-height:1.5; }
.wrap{ max-width:760px; margin:0 auto; padding:16px 14px 48px; }
h1{ margin:0; font-size:1.5rem; font-weight:800; display:flex; align-items:baseline; gap:10px; }
h1 .zh{ font-family:"Ma Shan Zheng","KaiTi",serif; font-weight:400; font-size:1.8rem; color:var(--muted); }
.panel{ background:var(--panel); border:1px solid var(--line); border-radius:18px; padding:16px; margin-top:14px; }
.muted{ color:var(--muted); }
.btn{ font-family:inherit; font-size:1rem; font-weight:600; border:none; border-radius:999px; padding:11px 20px; background:var(--ink); color:var(--bg); cursor:pointer; }
.btn.alt{ background:transparent; color:var(--ink); border:2px solid var(--ink); }
.btn.gold{ background:var(--gold); color:#1b2a24; }
.btn:disabled{ opacity:.4; cursor:not-allowed; }
.btn:focus-visible, button:focus-visible, input:focus-visible{ outline:3px solid var(--shield); outline-offset:2px; }
.row{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
input[type=text]{ font-family:inherit; font-size:1rem; padding:10px 14px; border-radius:12px; border:2px solid var(--line); background:var(--bg); color:var(--ink); min-width:0; }
.code{ font-size:2.4rem; font-weight:800; letter-spacing:.2em; text-align:center; margin:8px 0; }
.err{ color:var(--hp-low); font-weight:600; }
h2{ font-size:1.05rem; margin:0 0 8px; }

/* game */
.topbar{ display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; }
.roundtag{ font-weight:800; font-size:1.1rem; }
.roundtag.ot{ color:var(--gold); }
.fighter{ display:grid; gap:6px; }
.fighter .name{ font-weight:800; display:flex; justify-content:space-between; gap:8px; align-items:baseline; }
.lock{ font-size:.85rem; font-weight:600; color:var(--muted); }
.lock.done{ color:var(--sup); }
.bar{ position:relative; height:22px; border-radius:11px; background:var(--bg); border:1px solid var(--line); overflow:hidden; }
.bar i{ position:absolute; inset:0 auto 0 0; border-radius:11px; transition:width .5s ease; }
.bar span{ position:relative; display:block; font-size:.78rem; font-weight:800; line-height:20px; padding-left:10px; }
.bar.hp i{ background:color-mix(in srgb, var(--hp) 70%, var(--panel)); } .bar.hp.low i{ background:var(--hp-low); }
.bar.sh i{ background:color-mix(in srgb, var(--shield) 55%, var(--panel)); }
.bar.hp span{ color:var(--ink); }
.bar.sh{ height:16px; } .bar.sh span{ line-height:14px; font-size:.7rem; color:var(--ink); }
.chips{ display:flex; gap:6px; flex-wrap:wrap; }
.chip{ font-size:.76rem; padding:2px 9px; border-radius:999px; background:var(--bg); border:1px solid var(--line); }
.backs{ display:flex; gap:5px; flex-wrap:wrap; }
.back{ width:34px; height:46px; border-radius:7px; background:repeating-linear-gradient(45deg, var(--ink) 0 4px, var(--muted) 4px 8px); opacity:.55; }

.battle{ display:grid; grid-template-columns:1fr auto 1fr; gap:10px; align-items:center; }
.battle .who{ text-align:center; font-size:.78rem; font-weight:600; color:var(--muted); margin-bottom:4px; }
.vs{ font-weight:800; color:var(--muted); }
.events{ margin:12px 0 0; padding-left:0; list-style:none; font-size:.9rem; display:grid; gap:4px; }

.hand{ display:grid; grid-template-columns:repeat(auto-fill,minmax(92px,1fr)); gap:8px; }
.card{ position:relative; font-family:inherit; border:3px solid transparent; border-radius:14px; padding:8px 6px; text-align:center; display:flex; flex-direction:column; align-items:center; gap:2px; min-height:104px; color:#fff; }
button.card{ cursor:pointer; }
button.card:hover{ transform:translateY(-2px); }
.card.sel{ border-color:var(--ink); box-shadow:0 0 0 3px var(--bg), 0 0 0 6px var(--ink); transform:translateY(-4px); }
.card .ic{ font-size:1.7rem; line-height:1.2; }
.card .nm{ font-weight:800; font-size:.85rem; }
.card .ty{ font-size:.66rem; font-weight:600; background:rgba(255,255,255,.85); color:#1b2a24; border-radius:999px; padding:0 7px; margin-top:auto; }
.card.big{ min-height:128px; }
.card.big .ic{ font-size:2.2rem; }
.card .shade{ text-shadow:0 1px 3px rgba(0,0,0,.45); }
.card.mini{ min-height:0; padding:4px 8px; flex-direction:row; border-radius:10px; font-size:.8rem; }
.card.mini .ic{ font-size:1.1rem; }

.preview{ display:flex; gap:12px; align-items:center; margin-top:12px; padding:12px; border-radius:14px; background:var(--bg); min-height:70px; }
.preview .pic{ font-size:2rem; }
.preview .tt{ font-weight:800; }
.preview .ds{ font-size:.88rem; color:var(--muted); }
.t-damage{ color:var(--dmg); } .t-defense{ color:var(--def); } .t-support{ color:var(--sup); }

.over{ text-align:center; }
.over .big{ font-size:2rem; font-weight:800; margin:4px 0; }
.win{ color:var(--sup); } .lose{ color:var(--hp-low); }

details summary{ cursor:pointer; font-weight:600; }
.guide{ display:grid; gap:14px; margin-top:10px; }
.guide h3{ margin:0 0 6px; font-size:.95rem; }
.gitem{ display:flex; gap:10px; align-items:flex-start; font-size:.88rem; padding:5px 0; border-bottom:1px solid var(--line); }
.gitem .ic{ font-size:1.3rem; width:1.8em; text-align:center; }
.gitem b{ display:block; }
.pop{ animation:pop .35s ease-out; }
@keyframes pop{ from{ transform:scale(.85); opacity:0; } to{ transform:scale(1); opacity:1; } }
@media (prefers-reduced-motion: reduce){ .pop{ animation:none; } .bar i{ transition:none; } button.card:hover, .card.sel{ transform:none; } }

/* arena */
.arena{ position:relative; background:var(--panel); border:2px solid var(--gold); border-radius:22px; padding:14px; margin-top:14px; background-size:cover; background-position:center; }
.arena.has-mat{ color:#fff; background-size:cover; background-position:center 42%; border-color:#8a6a3f; box-shadow:inset 0 0 40px rgba(0,0,0,.45); }
.arena.has-mat .arena-inner{ background:none; padding:4px; }
.arena.has-mat h2, .arena.has-mat .who, .arena.has-mat .evhead, .arena.has-mat .vs, .arena.has-mat .note, .arena.has-mat p.muted{ color:#fff; opacity:1; text-shadow:0 1px 3px rgba(0,0,0,.85), 0 0 8px rgba(0,0,0,.5); }
.arena.has-mat .slot .empty{ background:rgba(20,16,12,.35); border-color:rgba(255,255,255,.6); color:#fff; text-shadow:0 1px 2px rgba(0,0,0,.8); backdrop-filter:blur(2px); }
.arena.has-mat .cardback{ box-shadow:0 6px 14px rgba(0,0,0,.45); }
.arena.has-mat .card{ box-shadow:0 6px 14px rgba(0,0,0,.45); }
.arena.has-mat .lastround{ border-top:none; background:rgba(20,16,12,.42); border-radius:14px; padding:10px 8px; backdrop-filter:blur(2px); }
.arena.has-mat .what summary{ color:#fff; }
.arena.has-mat .events{ color:#fff; }
.arena.has-mat .history{ border-top-color:rgba(255,255,255,.3); }
.arena.has-mat .hist{ color:#fff; text-shadow:0 1px 2px rgba(0,0,0,.8); }
.arena h2{ text-align:center; margin:0 0 10px; }
.slots{ display:grid; grid-template-columns:1fr auto 1fr; gap:10px; align-items:center; max-width:420px; margin:0 auto; }
.slot .who{ text-align:center; font-size:.78rem; font-weight:600; opacity:.75; margin-bottom:4px; }
.slot .empty{ min-height:128px; border:2px dashed var(--line); border-radius:14px; display:grid; place-items:center; font-size:.85rem; color:var(--muted); text-align:center; padding:6px; }
.cardback{ min-height:128px; border-radius:14px; background:repeating-linear-gradient(45deg, var(--ink) 0 6px, var(--muted) 6px 12px); background-size:cover; background-position:center; display:grid; place-items:center; color:#fff; font-weight:800; font-size:.8rem; text-shadow:0 1px 3px rgba(0,0,0,.6); }
.flip{ animation:flip .55s ease-out; }
@keyframes flip{ 0%{ transform:rotateY(90deg); } 100%{ transform:rotateY(0); } }
.evhead{ font-size:.8rem; font-weight:800; margin:12px 0 2px; }
.history{ display:flex; gap:6px; overflow-x:auto; padding:10px 2px 2px; margin-top:10px; border-top:1px solid var(--line); }
.hist{ flex:0 0 auto; text-align:center; font-size:.68rem; font-weight:600; opacity:.85; min-width:38px; }
.hist .pair{ display:grid; gap:2px; font-size:1.15rem; line-height:1.2; background:var(--bg); color:var(--ink); border-radius:8px; padding:3px 4px; }
.card img.art{ -webkit-user-drag:none; pointer-events:none;  width:100%; aspect-ratio:1; object-fit:cover; border-radius:9px; }
.card.mini img.art{ width:22px; height:22px; }
/* combo helper */
.helper{ margin-top:12px; }
.helper h3{ margin:0 0 6px; font-size:.9rem; }
.opts{ display:grid; gap:6px; }
.opt{ font-family:inherit; text-align:left; display:flex; gap:10px; align-items:center; padding:8px 10px; border-radius:12px; border:2px solid var(--line); background:var(--bg); color:var(--ink); cursor:pointer; }
.opt:hover{ border-color:var(--muted); }
.opt.on{ border-color:var(--ink); }
.opt .ic{ font-size:1.4rem; }
.opt .tt{ font-weight:800; font-size:.9rem; }
.opt .ds{ font-size:.8rem; color:var(--muted); }
/* hold slot */
.pocket{ display:flex; gap:12px; align-items:center; margin-top:10px; padding:10px; border-radius:14px; border:2px dashed var(--gold); }
.pocket .slotbox{ width:92px; flex:0 0 92px; }
.pocket .slotbox .empty{ min-height:104px; border-radius:14px; display:grid; place-items:center; font-size:.78rem; color:var(--muted); text-align:center; background:var(--bg); }
.pocket .info{ font-size:.85rem; }
.pocket .info b{ display:block; }
.seg{ display:inline-flex; border:2px solid var(--ink); border-radius:999px; overflow:hidden; margin-top:6px; }
.seg button{ font-family:inherit; font-size:.8rem; font-weight:600; border:none; background:transparent; color:var(--ink); padding:6px 12px; cursor:pointer; }
.seg button.on{ background:var(--ink); color:var(--bg); }
.card.hsel{ border-color:var(--gold); border-style:dashed; transform:translateY(-4px); }
.card.hsel::after{ content:"👖"; position:absolute; top:4px; right:6px; font-size:.9rem; }
.opp-pocket{ display:flex; align-items:center; gap:8px; font-size:.8rem; color:var(--muted); }
.opp-pocket .back{ width:26px; height:36px; }
/* full-art cards */
.card.art-card{ aspect-ratio:3/4; min-height:0; padding:0; justify-content:flex-end; overflow:hidden; }
.card.art-card .band{ width:100%; display:flex; flex-direction:column; align-items:center; gap:2px; padding:14px 4px 7px; background:linear-gradient(to bottom, rgba(0,0,0,0), rgba(0,0,0,.5) 45%); border-radius:0 0 11px 11px; }
.card.art-card .nm{ color:#fff; font-size:.85rem; text-shadow:0 1px 3px rgba(0,0,0,.6); }
.card.art-card .ty{ margin-top:0; }
.card.art-card.big{ min-height:0; }
.card.art-card.big .nm{ font-size:1rem; }
.card.art-card.mid .nm{ font-size:.8rem; }
.slots .slot .card.art-card, .slot .empty, .slot .cardback{ aspect-ratio:3/4; min-height:0; }
.slots.small{ max-width:320px; }
/* ready buttons + countdown */
.arena{ position:relative; }
.readyrow{ display:grid; grid-template-columns:1fr auto 1fr; gap:10px; max-width:420px; margin:10px auto 0; align-items:start; text-align:center; }
.readyrow > div:nth-child(2){ width:28px; }
.statusbtn{ display:block; width:100%; font-family:inherit; font-size:.95rem; font-weight:800; border-radius:999px; padding:10px 8px; border:2px solid transparent; }
.statusbtn.thinking{ background:rgba(255,255,255,.14); border-color:rgba(255,255,255,.55); color:#fff; }
.arena:not(.has-mat) .statusbtn.thinking{ background:var(--bg); border-color:var(--line); color:var(--muted); }
.statusbtn.on{ background:var(--sup); color:#fff; box-shadow:0 0 0 3px rgba(92,207,140,.35); }
button.statusbtn{ cursor:pointer; }
.readybtn{ width:100%; }
.tiny{ font-size:.7rem; margin-top:4px; opacity:.85; }
.arena.has-mat .tiny{ color:#fff; text-shadow:0 1px 2px rgba(0,0,0,.8); }
.dots::after{ content:""; animation:dots 1.2s steps(4) infinite; }
@keyframes dots{ 0%{ content:""; } 25%{ content:"."; } 50%{ content:".."; } 75%{ content:"..."; } }
.readycard .card{ opacity:.9; }
.countdown{ position:absolute; inset:0; display:grid; place-items:center; pointer-events:none; z-index:6; background:rgba(0,0,0,.25); border-radius:20px; }
.countdown span{ grid-area:1/1; font-size:6rem; font-weight:800; color:#fff; text-shadow:0 4px 16px rgba(0,0,0,.7); opacity:0; animation:cd 1s ease-out forwards; }
.countdown span.fight{ font-size:4.5rem; animation-duration:.6s; }
@keyframes cd{ 0%{ opacity:0; transform:scale(1.9); } 20%{ opacity:1; transform:scale(1); } 75%{ opacity:1; } 100%{ opacity:0; transform:scale(.7); } }
@media (prefers-reduced-motion: reduce){ .countdown span{ animation-name:cdFade; } @keyframes cdFade{ 0%,85%{ opacity:1; } 100%{ opacity:0; } } }
/* round results: shown over the card spots for 3 seconds, then fade away */
.slotwrap{ position:relative; }
.results{ position:absolute; inset:-6px -8px; z-index:4; pointer-events:none; display:flex; flex-direction:column; justify-content:center; gap:6px;
  background:rgba(14,11,8,.78); border-radius:16px; backdrop-filter:blur(3px); color:#fff; animation:resultsIn .35s ease-out; }
@keyframes resultsIn{ from{ opacity:0; } to{ opacity:1; } }
.results.stay{ position:static; animation:none; margin:6px 0; padding:10px 0; }
.rwho{ text-align:center; font-size:.72rem; font-weight:700; margin-bottom:3px; text-shadow:0 1px 3px rgba(0,0,0,.8); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.history.empty-hist{ visibility:hidden; }
.rtitle{ text-align:center; font-weight:800; font-size:.85rem; text-shadow:0 1px 3px rgba(0,0,0,.8); }
.rgrid{ display:grid; grid-template-columns:1fr minmax(84px,120px) auto minmax(84px,120px) 1fr; align-items:center; gap:8px; padding:0 8px; }
.rvs{ font-size:1.4rem; }
.rside{ font-size:.82rem; font-weight:600; line-height:1.35; }
.rside.opp{ text-align:right; } .rside.you{ text-align:left; }
.rlist{ list-style:none; margin:0; padding:0; display:grid; gap:3px; }
.rlist li{ text-shadow:0 1px 3px rgba(0,0,0,.8); }
.rcard .note{ color:#fff; }
@media (max-width:560px){
  .rgrid{ grid-template-columns:1fr auto 1fr; grid-template-areas:"oc vs yc" "ot . yt"; row-gap:6px; padding:0 4px; }
  .rgrid > .rc-l{ grid-area:oc; } .rgrid > .rc-r{ grid-area:yc; }
  .rgrid > .rvs{ grid-area:vs; } .rside.opp{ grid-area:ot; text-align:center; } .rside.you{ grid-area:yt; text-align:center; }
  .rcard{ max-width:118px; justify-self:center; width:100%; }
  .rside{ font-size:.74rem; }
}
@media (prefers-reduced-motion: reduce){ .results{ animation:none; } }
/* power rounds */
.powerbar{ margin-top:12px; padding:9px 14px; border-radius:14px; font-weight:800; font-size:.9rem; text-align:center; color:#1b2a24; background:linear-gradient(90deg, #f0c348, #ffdf7e, #f0c348); box-shadow:0 0 18px rgba(240,195,72,.45); }
.powerbar.soon{ background:var(--panel); color:var(--ink); border:2px dashed var(--gold); box-shadow:none; font-weight:600; }
.powertag{ display:inline-block; font-size:.8rem; padding:1px 8px; border-radius:999px; background:#f0c348; color:#1b2a24; vertical-align:middle; text-shadow:none; }
.arena.power{ border-color:#f0c348; animation:powerGlow 2.4s ease-in-out infinite; }
@keyframes powerGlow{ 0%,100%{ box-shadow:0 0 0 2px rgba(240,195,72,.4), 0 0 18px rgba(240,195,72,.35); } 50%{ box-shadow:0 0 0 3px rgba(240,195,72,.8), 0 0 34px rgba(240,195,72,.6); } }
/* tired */
.slot{ position:relative; }
.tiredtag{ position:absolute; left:50%; bottom:10px; transform:translateX(-50%); width:88%; z-index:3; pointer-events:none; text-align:center; font-weight:800; font-size:.85rem; line-height:1.2; padding:6px 4px; border-radius:10px; background:rgba(120,70,20,.88); color:#fff; box-shadow:0 3px 10px rgba(0,0,0,.35); }
.tiredtag small{ font-weight:600; font-size:.7rem; opacity:.95; }
.card.tiredcard{ filter:grayscale(.75) brightness(.8); opacity:.7; }
.card.tiredcard::before{ content:"😮‍💨"; position:absolute; top:4px; left:6px; font-size:1rem; z-index:2; filter:none; }
@media (prefers-reduced-motion: reduce){ .arena.power{ animation:none; box-shadow:0 0 0 3px rgba(240,195,72,.7); } }
/* Meadow peek on the board */
.peekstrip{ margin:0 auto 10px; max-width:520px; padding:8px 10px; border-radius:14px; background:rgba(47,138,76,.85); color:#fff; box-shadow:0 0 0 2px rgba(255,255,255,.5), 0 6px 16px rgba(0,0,0,.35); animation:peekIn .25s ease-out; }
.peeklabel{ font-weight:800; font-size:.85rem; text-align:center; margin-bottom:6px; }
.peekcards{ display:flex; flex-wrap:wrap; gap:5px; justify-content:center; align-items:center; }
.peektile{ display:flex; flex-direction:column; align-items:center; width:48px; }
.peektile img, .peektile .pe{ width:44px; height:44px; border-radius:8px; object-fit:cover; box-shadow:0 2px 6px rgba(0,0,0,.35); display:grid; place-items:center; font-size:1.4rem; background:rgba(255,255,255,.2); }
.peektile small{ font-size:.58rem; font-weight:700; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:48px; }
.peekheld{ font-size:1rem; margin-left:6px; }
@keyframes peekIn{ from{ opacity:0; transform:translateY(-6px); } to{ opacity:1; transform:none; } }
/* Meadow: the opponent's locked-in card, face up */
.peeked{ position:relative; }
.peeked .card{ box-shadow:0 0 0 3px #5ccf8c, 0 6px 16px rgba(0,0,0,.4); }
.peekedtag{ position:absolute; top:-10px; left:50%; transform:translateX(-50%); background:#2f8a4c; color:#fff; font-weight:800; font-size:.72rem; padding:2px 10px; border-radius:999px; white-space:nowrap; box-shadow:0 2px 6px rgba(0,0,0,.3); }
.slot .empty small{ font-size:.7rem; opacity:.85; }
/* Garden picker */
.regrowbox{ margin-top:10px; padding:10px 12px; border-radius:14px; border:2px solid var(--sup); background:color-mix(in srgb, var(--sup) 10%, var(--panel)); font-size:.85rem; }
@media (prefers-reduced-motion: reduce){ .peekstrip{ animation:none; } }
/* drag and drop */
[data-drag]{ touch-action:none; user-select:none; -webkit-user-select:none; }
.ghost{ position:fixed; left:0; top:0; z-index:50; pointer-events:none; opacity:.92; box-shadow:0 12px 28px rgba(0,0,0,.35); margin:0; }
.dragging{ opacity:.3; }
.is-dragging [data-dropzone]:not([data-dropzone=""]) .empty, .is-dragging .dropzone{ border-color:var(--gold); background:color-mix(in srgb, var(--gold) 12%, var(--bg)); }
.drop-hover{ outline:4px solid var(--gold); outline-offset:3px; border-radius:16px; }
button.empty{ font-family:inherit; width:100%; cursor:pointer; }
.dropzone-hand{ min-height:110px; border-radius:14px; padding:4px; }
.split{ position:absolute; top:4px; right:4px; width:22px; height:22px; border-radius:50%; background:rgba(255,255,255,.9); color:#1b2a24; font-size:.75rem; font-weight:800; display:grid; place-items:center; cursor:pointer; }
.tagH{ position:absolute; top:4px; left:6px; font-size:.9rem; }
.card.mid{ min-height:0; padding:6px; }
.card.mid .ic{ font-size:1.5rem; }
.slots.small{ max-width:300px; }
.lastround{ margin-top:14px; padding-top:10px; border-top:1px solid var(--line); }
.note{ font-size:.72rem; text-align:center; opacity:.8; margin-top:2px; }

@keyframes floatUp{ 0%{ transform:translate(-50%,6px) scale(.7); opacity:0; } 15%{ transform:translate(-50%,-6px) scale(1.15); opacity:1; } 70%{ opacity:1; } 100%{ transform:translate(-50%,-44px) scale(1); opacity:0; } }

@media (prefers-reduced-motion: reduce){ .flip, .clash-l, .clash-r, .spark, .chunk{ animation:none; } .chunk{ display:none; } .floater{ animation:fadeOnly 1.6s forwards; } @keyframes fadeOnly{ 0%,70%{ opacity:1; } 100%{ opacity:0; } } }

const TYPE = { damage:{label:'Damage',icon:'⚔️'}, defense:{label:'Defense',icon:'🛡️'}, support:{label:'Support',icon:'💚'} };

function describe(d){

  if (d.heal) p.push(`heal ${d.heal}`);
  if (d.hot) p.push(`heal ${d.hot.amt} each round for ${d.hot.rounds} rounds`);
  if (d.sot) p.push(`+${d.sot.amt} shield each round for ${d.sot.rounds} rounds`);

// ---------- the shared deck ----------
function shuffle(a){ for (let i=a.length-1;i>0;i--){ const j=rnd(i+1); [a[i],a[j]]=[a[j],a[i]]; } return a; }
// Draw the top card; if the deck is empty, shuffle the discard pile back in first.
function drawCard(s){

    s.deck = shuffle(s.discard); s.discard = []; s.reshuffled = true;

// Deal one card at a time, taking turns, until both hands are full.
function dealRound(s, first){

    order.forEach(i => { if (s.players[i].hand.length < HAND) s.players[i].hand.push(drawCard(s)); });

}
function newPlayer(name){

function newGame(names){

// Healing past full health turns into shield (up to the shield max).
function healWithOverflow(p, n){

// Garden: take any card from the shared discard pile into your hand.

function applyPeek(s, pi, srcs){
  const p = s.players[pi];
  if (p.peek || !Array.isArray(srcs) || !srcs.length || srcs.length > 2) return false;
  if (new Set(srcs.map(String)).size !== srcs.length) return false;
  const els = [];
  for (const x of srcs){
    if (x === 'H'){ if (!p.held || p.held.els.length !== 1) return false; els.push(...p.held.els); }
    else if (Number.isInteger(x) && x >= 0 && x < p.hand.length) els.push(...cardEls(p.hand[x]));

  }

// Where the computer could find a Meadow in its hand (not using its held card).
function findMeadow(p){

function addEffect(p, id, kind, amt, rounds, label, icon){
  const e = p.effects.find(x => x.id === id);

  else p.effects.push({ id, kind, amt, left:rounds, label, icon });

// Over-time effects tick at the start of each round, before cards are played.
function tickEffects(s){

    const q = s.round - POWER_FROM + 2;
    s.players.forEach((p, pi) => { p.hp -= q; fx.push({ t:pi, kind:'hp-', amt:q, icon:'🪨' }); });
    ev.push(`🪨 The arena crumbles! Both fighters lose ${q} health.`);
  }
  s.players.forEach((p, pi) => {
    p.effects.forEach(e => {
      if (e.kind === 'dot'){ p.hp -= e.amt; dealt[1-pi] += e.amt; ev.push(`${e.icon} ${e.label}: ${p.name} loses ${e.amt} health.`); fx.push({ t:pi, kind:'hp-', amt:e.amt, icon:e.icon }); }

        if (r.shield){ ev.push(`🛡️ ${p.name}'s extra healing becomes ${r.shield} shield.`); fx.push({ t:pi, kind:'sh+', amt:r.shield }); } }

// Both fighters dropped to 0 in the same moment: whoever dealt more damage in that final round wins. Equal damage is a tie.

function aiRegrow(s, pi, level){

// ================= TWO-SLOT RULES =================
// Each round a player may put a card in their ⚔️ attack slot and/or their 🛡️ defense slot.
// Damage cards go in ⚔️, Defense cards in 🛡️, Support cards fit either (but only one Support card per round).
const SLOTS = ['atk','def'];

// A move:
//   atk:{ cards:[hand indexes], useHeld }, def:{ cards:[hand indexes], useHeld }   (either may be empty)
//   hold:{ cards:[hand indexes], useHeld }   put a single card in the Hold slot (a full slot swaps its card back)

function slotInfo(p, part){

function validMove(p, mv){

    if (part.useHeld){ if (!p.held || heldGone) return false; heldGone = true; }
    const info = slotInfo(p, part); if (!info) continue;
    if (info.els.length > 2 || (info.els.length === 2 && slotTired(p, slot))) return false;
    if (info.key === MEADOW || !slotFits(slot, info.d)) return false;

function allMoves(p){                        // every way to fill the two slots from single hand cards, pairs, and the held card

// Discard all: once per game, throw your hand away and draw 5 fresh cards right now. Your held card stays.
function applyDiscardAll(s, pi){

function resolve(state, moves){
  const s = clone(state), P = s.players, ev = [], fx = [], dealt = [0,0];
  const F = (t, kind, amt, label) => fx.push({ t, kind, amt, label });
  const pm = isPowerRound(s.round) ? POWER : 1;                    // power rounds: only attacks get ×1.5
  const play = P.map((p,i) => ({ atk:slotInfo(p, moves[i].atk), def:slotInfo(p, moves[i].def) }));
  const mult = P.map(p => ({ atk:p.forgeAtk ? 2 : 1, def:p.forgeDef ? 2 : 1 }));
  P.forEach(p => { p.forgeAtk = false; p.forgeDef = false; p.peek = false; });
  const val = (i, slot, n, attack) => Math.ceil(Math.max(0, n) * mult[i][slot] * (attack ? pm : 1));
  const next = [{}, {}], tire = [{ atk:false, def:false }, { atk:false, def:false }], cured = [false,false];

  // Phase 1: defense and support cards, from either slot
  for (let i=0;i<2;i++) for (const slot of SLOTS){
    const c = play[i][slot]; if (!c || c.d.type === 'damage') continue;
    const d = c.d, p = P[i], o = P[1-i];
    if (d.shield){ const b = p.shield; p.shield = Math.min(MAX_SHIELD, p.shield + val(i,slot,d.shield)); ev.push(`🛡️ ${p.name} builds ${p.shield-b} shield.`); if (p.shield > b) F(i,'sh+',p.shield-b); }
    if (d.heal){ const r = healWithOverflow(p, val(i,slot,d.heal)); if (r.healed){ ev.push(`💚 ${p.name} heals ${r.healed}.`); F(i,'hp+',r.healed); } if (r.shield){ ev.push(`🛡️ ${p.name}'s extra healing becomes ${r.shield} shield.`); F(i,'sh+',r.shield); } }
    if (d.hot){ addEffect(p, c.key+':hot', 'hot', d.hot.amt * mult[i][slot], d.hot.rounds, 'Heal', '💚'); ev.push(`💚 ${p.name} will heal ${d.hot.amt * mult[i][slot]} each round for ${d.hot.rounds} rounds.`); F(i,'status',0,'💚 Regen'); }
    if (d.sot){ addEffect(p, c.key+':sot', 'sot', d.sot.amt * mult[i][slot], d.sot.rounds, 'Wall', '🧱'); ev.push(`🧱 ${p.name}'s wall will grow each round.`); F(i,'status',0,'🧱 Growing wall'); }
    if (d.dot){ addEffect(o, c.key+':dot', 'dot', d.dot.amt * mult[i][slot], d.dot.rounds, d.dot.label, d.dot.icon); ev.push(`${d.dot.icon} ${o.name} will ${d.dot.label.toLowerCase()} each round.`); F(1-i,'status',0,`${d.dot.icon} ${d.dot.label}!`); }
    if (d.block){ p.block = true; ev.push(`🌪️ ${p.name} is ready to block the next hit.`); F(i,'status',0,'🌪️ Guard up'); }
    if (d.boost){ p.boost += val(i,slot,d.boost); ev.push(`🌳 ${p.name}'s next attack gets +${val(i,slot,d.boost)}.`); F(i,'status',0,`🌳 +${val(i,slot,d.boost)} power`); }
    if (d.forge){ next[i][slot] = true; ev.push(`🔨 ${p.name}'s next ${slot === 'atk' ? 'attack' : 'defense'} card will be doubled.`); F(i,'status',0, slot === 'atk' ? '🔨 ×2 next ⚔️' : '🔨 ×2 next 🛡️'); }
    if (d.regrow){ p.regrow++; ev.push(`🌱 ${p.name} can take a card from the discard pile.`); F(i,'status',0,'🌱 Regrow'); }
    if (d.cure) cured[i] = true;
    if (d.cleanse){ const had = p.effects.some(e => e.kind === 'dot'); p.effects = p.effects.filter(e => e.kind !== 'dot'); ev.push(`🌧️ ${p.name} is washed clean${had ? ' of burns and cuts' : ''}.`); F(i,'status',0,'🌧️ Cleansed'); }

    const t = P[h.t];

    if (h.dot){ addEffect(t, h.dot.id, 'dot', h.dot.amt, h.dot.rounds, h.dot.label, h.dot.icon); F(h.t,'status',0,`${h.dot.icon} ${h.dot.label}!`); ev.push(`${h.dot.icon} ${t.name} will ${h.dot.label.toLowerCase()} each round.`); }

    const icon = slot === 'atk' ? '⚔️' : '🛡️';
    if (cured[i]){ ev.push(`✨ ${P[i].name} shakes off being Tired.`); F(i,'status',0,'✨ Not tired!'); }
    else { ev.push(`😮‍💨 ${P[i].name} is Tired ${icon}: single cards only in that slot next round.`); F(i,'status',0,`😮‍💨 Tired ${icon}!`); }
  }

    const holdEls = mv.hold ? (mv.hold.cards || []).flatMap(ix => cardEls(p.hand[ix])) : null;
    const kept = (mv.merges || []).map(m => keyOf(m.flatMap(x => x === 'H' ? oldHeld.els : cardEls(p.hand[x]))));
    const heldMerged = (mv.merges || []).some(m => m.includes('H'));
    let back = null;
    if (oldHeld && (mv.unhold || (mv.hold && !usedHeld && !heldMerged))) back = keyOf(oldHeld.els);
    if (usedHeld || heldMerged || back) p.held = null;
    if (holdEls && holdEls.length) p.held = { els:holdEls };
    const playedIdx = [...((mv.atk && mv.atk.cards) || []), ...((mv.def && mv.def.cards) || [])];
    const gone = [...playedIdx, ...((mv.hold && mv.hold.cards) || []), ...(mv.merges || []).flat().filter(x => x !== 'H')];
    gone.sort((a,b) => b-a).forEach(ix => p.hand.splice(ix,1));
    p.hand.push(...kept); if (back) p.hand.push(back);
    SLOTS.forEach(slot => { if (play[i][slot]) s.discard.push(...play[i][slot].els); });
  }
  s.reshuffled = false;
  const drew = refillRound(s, s.round % 2);
  drew.forEach((n,i) => { if (n === HAND) ev.push(`🎴 ${P[i].name} emptied their hand and draws a fresh 5!`); });
  if (s.reshuffled){ ev.push('🔀 The deck ran out, so the discard pile was shuffled back in.'); F(0,'status',0,'🔀 Deck reshuffled'); F(1,'status',0,'🔀 Deck reshuffled'); }

  const dead = P.map(p => p.hp <= 0);
  if (dead[0] || dead[1]){ s.over = true; s.reason = 'ko'; s.winner = dead[0] && dead[1] ? doubleKO(s, dealt) : dead[0] ? 1 : 0; }
  else if (s.round >= ROUNDS){
    if (P[0].hp !== P[1].hp){ s.over = true; s.reason = 'time'; s.winner = P[0].hp > P[1].hp ? 0 : 1; }
    else if (s.round === ROUNDS){ s.round++; s.overtime = true; }
    else { s.over = true; s.reason = 'time'; s.winner = null; }
  } else s.round++;

    const tk = tickEffects(s); s.startEvents = tk.ev; s.startFx = tk.fx;
    const dd = P.map(p => p.hp <= 0);
    if (dd[0] || dd[1]){ s.over = true; s.reason = 'ko'; s.winner = dd[0] && dd[1] ? doubleKO(s, tk.dealt) : dd[0] ? 1 : 0; }
  }
  return s;
}

function viewFor(s, pi, locked, pending){
  const you = s.players[pi], opp = s.players[1-pi];
  const slotView = (p, part) => { const i = slotInfo(p, part); return i && { key:i.key, els:i.els, fromHeld:i.fromHeld }; };
  return {
    round:s.round, overtime:s.overtime, over:s.over, reason:s.reason, power:isPowerRound(s.round),
    doubleKO: s.doubleKO ? { you:s.doubleKO.dealt[pi], opp:s.doubleKO.dealt[1-pi] } : null,
    result: !s.over ? null : s.winner === null ? 'draw' : s.winner === pi ? 'win' : 'lose',
    you: clone(you),
    opp: Object.assign(clone(opp), { hand: you.peek ? clone(opp.hand) : null, handCount: opp.hand.length, held: you.peek ? clone(opp.held) : null, hasHeld: !!opp.held, peek:false }),
    history: s.history.map(h => ({ round:h.round, overtime:h.overtime, you:h.cards[pi], opp:h.cards[1-pi], fx:(h.fx || []).map(f => Object.assign({}, f, { who: f.t === pi ? 'you' : 'opp' })) })),
    startEvents: s.startEvents || [],
    startFx: (s.startFx || []).map(f => Object.assign({}, f, { who: f.t === pi ? 'you' : 'opp' })),
    discard: s.discard.slice(),
    last: s.last ? { round:s.last.round, overtime:s.last.overtime, you:s.last.cards[pi], opp:s.last.cards[1-pi], events:s.last.events, fx:(s.last.fx || []).map(f => Object.assign({}, f, { who: f.t === pi ? 'you' : 'opp' })) } : null,
    youLocked: !!(locked && locked[pi]), oppLocked: !!(locked && locked[1-pi]),
    // 🌾 Meadow: once they press Ready, the peeking player sees both of their cards
    oppCards: (you.peek && pending && pending[1-pi]) ? { atk:slotView(opp, pending[1-pi].atk), def:slotView(opp, pending[1-pi].def) } : null
  };
}

// ================= COMPUTER PLAYER (two slots) =================
function evaluate(s, pi){
  if (s.over) return s.winner === null ? 0 : s.winner === pi ? 1000 : -1000;
  const fx = p => p.effects.reduce((t,e) => t + e.amt*e.left*(e.kind==='dot' ? -1 : e.kind==='hot' ? 0.9 : 0.5), 0);
  const f = p => p.hp + p.shield*0.6 + p.boost*0.5 + (p.forgeAtk?4:0) + (p.forgeDef?3:0) + (p.block?4:0) + fx(p) + (p.held?2:0) + p.regrow*2
    + p.hand.length*0.8 - (p.tiredAtk?1.5:0) - (p.tiredDef?1.2:0);
  return f(s.players[pi]) - f(s.players[1-pi]);
}
function aiMove(s, pi, level){
  const moves = allMoves(s.players[pi]);
  if (level === 'easy'){
    const both = moves.filter(m => slotInfo(s.players[pi], m.atk) && slotInfo(s.players[pi], m.def));
    return (both.length && Math.random() < 0.6 ? both : moves)[rnd((both.length && Math.random() < 0.6 ? both : moves).length)] || moves[0];
  }
  const o = s.players[1-pi], K = level === 'hard' ? 6 : 3, noise = level === 'hard' ? 0.3 : 2;
  let samples;
  if (level === 'hard') samples = allMoves(o).sort(() => Math.random() - .5).slice(0, K);           // Hard reads your actual hand
  else samples = Array.from({ length:K }, () => { const sim = clone(s); sim.players[1-pi].hand = drawN(o.hand.length); const om = allMoves(sim.players[1-pi]); return { st:sim, mv:om[rnd(om.length)] }; });
  let best = moves[0], bs = -Infinity;
  for (const m of moves){
    let t = 0;
    for (const x of samples){
      const st = level === 'hard' ? s : x.st, om = level === 'hard' ? x : x.mv;
      t += evaluate(resolve(st, pi === 0 ? [m, om] : [om, m]), pi);
    }
    const sc = t / samples.length + (Math.random() - .5) * noise;
    if (sc > bs){ bs = sc; best = m; }
  }
  return best;
}
// The computer peeked with Meadow and has seen your cards: pick the best answer.
function aiCounter(s, pi, theirMove, level){
  if (level === 'easy') return aiMove(s, pi, level);
  let best = null, bs = -Infinity;
  for (const m of allMoves(s.players[pi])){ const sc = evaluate(resolve(s, pi === 0 ? [m, theirMove] : [theirMove, m]), pi) + Math.random()*0.3; if (sc > bs){ bs = sc; best = m; } }
  return best;
}
function aiHold(s, pi, mv, level){
  const p = s.players[pi]; const usedHeld = (mv.atk && mv.atk.useHeld) || (mv.def && mv.def.useHeld);
  if (p.held && !usedHeld) return null;
  const busy = [...((mv.atk && mv.atk.cards) || []), ...((mv.def && mv.def.cards) || [])];
  const free = p.hand.map((e,i) => i).filter(i => !busy.includes(i) && !p.hand[i].includes('+'));
  if (!free.length) return null;
  if (level === 'easy') return Math.random() < 0.25 ? { cards:[free[rnd(free.length)]] } : null;
  const want = p.hp >= 20 ? ['water','earth'] : ['fire','wind'];
  const pick = free.find(i => want.includes(p.hand[i]));
  return pick === undefined ? null : { cards:[pick] };
}
// The computer uses its one Discard all when its hand has no way to attack.
function aiMaybeDiscard(s, pi, level){
  const p = s.players[pi]; if (p.discardUsed || level === 'easy' || s.round < 2) return false;
  const canAttack = allMoves(p).some(m => { const i = slotInfo(p, m.atk); return i && i.d.type === 'damage'; });
  return !canAttack ? applyDiscardAll(s, pi) : false;
}

<script>
// ================= UI =================
const $app = document.getElementById('app');
const esc = t => String(t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let screen = 'menu', view = null, ctrl = null, lobby = {}, myName = '';

// ---------- optional art (drop files into an assets/ folder) ----------
const ART = Object.assign({}, typeof BUILTIN_ART !== 'undefined' ? BUILTIN_ART : {});
function artPath(k){ return k === 'back' ? 'assets/card-back.png' : k === 'mat' ? 'assets/arena-mat.jpg' : k.includes('+') ? `assets/combo-${k.replace('+','-')}.png` : `assets/card-${k}.png`; }
// Try the assets/ folder first, then the same file name sitting right next to index.html.
[...Object.keys(CARDS), 'back', 'mat'].forEach(k => {
  const tryLoad = (paths) => { if (!paths.length) return; const img = new Image();
    img.onload = () => { ART[k] = paths[0]; if (screen === 'game') render(); };
    img.onerror = () => tryLoad(paths.slice(1)); img.src = paths[0]; };
  tryLoad([artPath(k), artPath(k).replace('assets/', '')]);
});
let seenReveal = null;

// ---------- controllers ----------
function localController(mode, names, level){
  let s = newGame(names), pending = [null,null], conn = null, cdEnd = 0, cdTimer = null, aiTimer = null;
  let reviewing = false, acks = [false,false];     // after each battle, both players read the results and press Continue
  const COUNTDOWN = 3000;
  const c = {
    mode, me:0,
    push(){
      const locked = [!!pending[0], !!pending[1]], countdown = cdEnd ? Math.max(0, cdEnd - Date.now()) : 0;
      const extra = pi => ({ countdown, reviewing, youAck:acks[pi], oppAck:acks[1-pi] });
      showGame(Object.assign(viewFor(s, 0, locked, pending), extra(0)));
      if (conn && conn.open) conn.send({ type:'view', view:Object.assign(viewFor(s, 1, locked, pending), extra(1)) });
    },
    submit(pi, mv){
      if (s.over || cdEnd || reviewing || pending[pi] || !validMove(s.players[pi], mv)) return;
      pending[pi] = mv;
      if (mode === 'ai' && pi === 0){
        c.push();
        if (pending[1]){ c.tryResolve(); return; }          // the computer already committed (you had Meadow)
        // The computer gets ready right after you do. If it has Meadow, it has seen your card and answers it.
        aiTimer = setTimeout(() => { if (!pending[0] || cdEnd) return; c.aiReady(); }, 700);
        return;
      }
      c.tryResolve();
    },
    unready(){ },                                   // Ready is final: nobody can take it back
    aiReady(){

      mv.hold = aiHold(s,1,mv,level); pending[1] = mv; c.tryResolve();
    },
    // When you have Meadow, the computer locks in first so you can see its card.
    aiMaybeFirst(){ if (mode === 'ai' && !reviewing && !s.over && s.players[0].peek && !pending[1]) setTimeout(() => { if (!reviewing) c.aiReady(); }, 900); },
    tryResolve(){
      if (pending[0] && pending[1] && !cdEnd){

    },
    regrow(pi, el, idx){ if (!pending[pi] && !cdEnd && !reviewing && applyRegrow(s, pi, el, idx)) c.push(); },
    // 🌾 Meadow used as a free action. Against the computer, it locks in right away so you can see its card.
    // 🗑️ Discard all: once per game, a fresh hand of 5 right away
    discardAll(pi){ if (reviewing || cdEnd || pending[pi] || s.over || !applyDiscardAll(s, pi)) return; c.push(); },
    usePeek(pi, srcs){
      if (reviewing || cdEnd || pending[pi] || s.over || !applyPeek(s, pi, srcs)) return;
      if (mode === 'ai' && pi === 0 && !pending[1]){ clearTimeout(aiTimer); c.aiReady(); } else c.push();
    },
    ack(pi){ if (!reviewing || acks[pi]) return; acks[pi] = true; if (acks[0] && acks[1]){ reviewing = false; acks = [false,false]; c.aiMaybeFirst(); } c.push(); },
    rematch(){ clearTimeout(cdTimer); clearTimeout(aiTimer); cdEnd = 0; reviewing = false; acks = [false,false]; s = newGame(names); pending = [null,null]; resetPicks(); c.push(); },
    attach(cn){ conn = cn; },
    move(mv){ c.submit(0, mv); }, unreadyMe(){ c.unready(0); }, ackMe(){ c.ack(0); }, doRegrow(el, idx){ c.regrow(0, el, idx); }, doPeek(srcs){ c.usePeek(0, srcs); }, doDiscard(){ c.discardAll(0); }
  };
  return c;
}
function guestController(conn){
  return { mode:'guest', move(mv){ conn.send({ type:'move', move:mv }); }, unreadyMe(){ conn.send({ type:'unready' }); }, ackMe(){ conn.send({ type:'ack' }); }, doRegrow(el, idx){ conn.send({ type:'regrow', el, idx }); }, doPeek(srcs){ conn.send({ type:'peek', srcs }); }, doDiscard(){ conn.send({ type:'discardall' }); }, rematch(){ conn.send({ type:'rematch' }); } };
}

// ---------- networking ----------
let peer = null;
function cleanupPeer(){ try { peer && peer.destroy(); } catch(e){} peer = null; }
const CODE_CHARS = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
const makeCode = () => Array.from({length:5}, () => CODE_CHARS[rnd(CODE_CHARS.length)]).join('');
const peerId = code => 'elemental-battle-' + code.toLowerCase();

function hostGame(){
  if (typeof Peer === 'undefined'){ lobby = { role:'host', error:'Online play could not load. Check your internet connection and reload the page.' }; screen='lobby'; render(); return; }
  cleanupPeer();
  const code = makeCode();
  lobby = { role:'host', code, status:'Setting up your game…' }; screen = 'lobby'; render();
  peer = new Peer(peerId(code));
  peer.on('open', () => { lobby.status = 'Send this code to your friend. The game starts when they join.'; render(); });
  peer.on('error', err => {
    if (err.type === 'unavailable-id') return hostGame();
    lobby.error = 'Connection problem: ' + err.type + '. Go back and try hosting again.'; render();
  });
  peer.on('connection', conn => {
    if (ctrl && ctrl.mode === 'host'){ conn.on('open', () => { conn.send({ type:'full' }); setTimeout(() => conn.close(), 300); }); return; }
    conn.on('data', msg => {
      if (msg.type === 'hello' && !ctrl){
        ctrl = localController('host', [myName || 'Host', String(msg.name || 'Guest').slice(0,20)]);
        ctrl.attach(conn); screen = 'game'; ctrl.push();
      } else if (!ctrl) return;
      else if (msg.type === 'move') ctrl.submit(1, msg.move);
      else if (msg.type === 'unready') ctrl.unready(1);
      else if (msg.type === 'ack') ctrl.ack(1);
      else if (msg.type === 'regrow') ctrl.regrow(1, msg.el, msg.idx);
      else if (msg.type === 'peek') ctrl.usePeek(1, msg.srcs);
      else if (msg.type === 'discardall') ctrl.discardAll(1);
      else if (msg.type === 'rematch') ctrl.rematch();
    });
    conn.on('close', () => disconnected());
  });
}
function joinGame(code){
  code = code.trim().toUpperCase();
  if (code.length !== 5){ lobby = { role:'join', error:'Game codes have 5 letters and numbers.' }; screen='lobby'; render(); return; }
  if (typeof Peer === 'undefined'){ lobby = { role:'join', error:'Online play could not load. Check your internet connection and reload the page.' }; screen='lobby'; render(); return; }
  cleanupPeer();
  lobby = { role:'join', code, status:'Looking for the game…' }; screen = 'lobby'; render();
  peer = new Peer();
  peer.on('open', () => {
    const conn = peer.connect(peerId(code), { reliable:true });
    conn.on('open', () => { conn.send({ type:'hello', name:myName || 'Guest' }); lobby.status = 'Connected! Starting…'; render(); });
    conn.on('data', msg => {
      if (msg.type === 'full'){ lobby.error = 'That game already has two players.'; render(); return; }
      if (msg.type === 'view'){ if (!ctrl) ctrl = guestController(conn); screen = 'game'; showGame(msg.view); }
    });
    conn.on('close', () => disconnected());
  });
  peer.on('error', err => {
    lobby.error = err.type === 'peer-unavailable' ? `No game found with code ${code}. Check the code with your friend.` : 'Connection problem: ' + err.type + '.';
    render();
  });
}
function disconnected(){
  if (screen === 'game' && view && !view.over){ view.disconnected = true; render(); }
}
function toMenu(){ cleanupPeer(); ctrl = null; view = null; resetPicks(); screen = 'menu'; render(); }

// ---------- rendering helpers ----------
function cardFace(key, els, cls='', btn='', attrs=''){

function howToHTML(){

      ${step(2, 'Merge for power', `${tileHTML('fire')}<span class="op">+</span>${tileHTML('water')}<span class="op">=</span>${tileHTML('fire+water')}`, 'Drop one card onto another to make a stronger combo.')}

resetPicks();
const srcOf = id => id.split('+').map(x => x === 'H' ? 'H' : +x);

  you.hand.forEach((_,i) => { if (!inPair.has(String(i)) && !placed(String(i))) out.push(String(i)); });
  ui.merges.forEach(m => { const id = idOf(m); if (!placed(id)) out.push(id); });
  if (ui.unheld && you.held && !inPair.has('H') && !placed('H')) out.push('H');   // the held card, brought back into your hand

}
const playedIds = () => [ui.slots.atk, ui.slots.def].filter(Boolean);
function unplace(id){ if (ui.slots.atk === id) ui.slots.atk = null; if (ui.slots.def === id) ui.slots.def = null; if (ui.hold === id) ui.hold = null; }

  if (a === 'H' || b === 'H'){ if (you.held.els.length !== 1) return 'A held combo cannot merge again.'; }

}

  if (els.length === 2 && slotTired(you, slot)) return `You're Tired ${slot === 'atk' ? '⚔️' : '🛡️'}: only single cards in that slot this round.`;

const SELF_STATUS = /Guard|Regen|wall|power|×2|Peek|Regrow|Cleansed|Blocked|Not tired/;
// Compact icons for one round in the history column: what this player's card did.
function shortSummary(fx, who){

function sideSummary(fx, who){

  you.hand.forEach(c => { if (c.includes('+')) return; const k = pairKey(el, c); if (seen.has(k)) return; seen.add(k); opts.push({ k, c }); });
  let h = `<div class="preview"><span class="pic">${d.icon}</span><div><div class="tt">${d.name} <span class="t-${d.type}">${TYPE[d.type].icon} ${TYPE[d.type].label}</span> <span class="muted">(discard pile)</span></div><div class="ds">${describe(d)}.</div></div></div>`;
  h += `<div class="row acts">${full ? `<span class="muted">Hand full: drag it onto the card to throw away.</span>` : `<button class="btn" data-act="regrowtake" data-el="${el}">🌱 Take it</button><span class="muted">or drag it into your hand</span>`}<button class="btn alt" data-act="unpick">Close</button></div>`;
  if (opts.length) h += `<div class="helper"><h3>With your hand it could merge into:</h3><div class="opts">${opts.map(o => { const c = CARDS[o.k];
    return `<div class="opt" style="cursor:default"><span class="ic">${c.icon}</span><div><div class="tt">+ ${EL[o.c].icon} = ${c.name} <span class="t-${c.type}">${TYPE[c.type].icon}</span></div><div class="ds">${describe(c)}</div></div></div>`; }).join('')}</div></div>`;
  return h;
}
function helperHTML(you){
  const id = ui.picked;
  if (!id) return '';
  if (isDiscard(id)) return discardHelper(you, id.slice(2));
  const els = itemEls(you, id), k = keyOf(els), d = CARDS[k];
  let h = `<div class="preview"><span class="pic">${d.icon}</span><div><div class="tt">${d.name} <span class="t-${d.type}">${TYPE[d.type].icon} ${TYPE[d.type].label}${els.length===2?' combo':''}</span></div><div class="ds">${describe(d)}.</div></div></div>`;
  const acts = [];
  if (isMeadow(you, id)) acts.push(`<button class="btn gold" data-act="place" data-zone="atk" ${you.peek ? 'disabled' : ''}>🌾 Use Meadow (free)</button>`);
  else {
    if (!slotProblem(you, id, 'atk')) acts.push(`<button class="btn" data-act="place" data-zone="atk">⚔️ Attack slot</button>`);
    if (!slotProblem(you, id, 'def')) acts.push(`<button class="btn" data-act="place" data-zone="def">🛡️ Defense slot</button>`);
  }
  if (canHoldItem(you, id)) acts.push(`<button class="btn alt" data-act="place" data-zone="hold">👖 Hold it</button>`);
  acts.push(`<button class="btn alt" data-act="unpick">Close</button>`);
  h += `<div class="row acts">${acts.join('')}</div>`;
  if (els.length === 1){
    const seen = new Set(), opts = [];
    handItems(you).concat(you.held && you.held.els.length === 1 && !id.includes('H') ? ['H'] : []).forEach(o => {
      if (o === id || o.includes('+') || itemEls(you, o).length !== 1) return;
      const e = itemEls(you, o)[0], key = pairKey(els[0], e); if (seen.has(key)) return; seen.add(key); opts.push({ o, key, e });
    });
    if (opts.length) h += `<div class="helper"><h3>${EL[els[0]].icon} ${EL[els[0]].name} can merge into:</h3><div class="opts">${opts.map(x => { const c = CARDS[x.key];
      return `<button class="opt" data-act="mergewith" data-id="${x.o}"><span class="ic">${c.icon}</span><div><div class="tt">+ ${EL[x.e].icon}${x.o==='H'?' (held)':''} = ${c.name} <span class="t-${c.type}">${TYPE[c.type].icon}</span></div><div class="ds">${describe(c)}</div></div></button>`; }).join('')}</div></div>`;
  }
  return h;
}

function renderGame(){
  const v = view, you = v.you, opp = v.opp;
  const frozen = v.youLocked || v.reviewing || v.over;
  const label = v.over ? 'Game over' : v.overtime ? `Round ${ROUNDS + 1}: Overtime!` : `Round ${v.round} of ${ROUNDS}`;
  let h = `<div class="board ${v.power && !v.over ? 'power' : ''}" ${ART.mat ? `style="background-image:linear-gradient(rgba(10,8,6,.35),rgba(10,8,6,.55)),url(${ART.mat})"` : ''}>`;
  // top: the opponent
  h += `<header class="tbar opp-bar">
    <button class="iconbtn" data-act="menu" title="Leave the game" aria-label="Leave the game">✕</button>
    <div class="who" id="nm-opp">${esc(opp.name)}</div>
    <div class="vit">${bars(opp,'opp')}</div>
    ${chips(opp)}
    ${opp.hand && !v.over
      ? `<div class="peekstrip inbar" role="status" title="🌾 Meadow: you can see their hand"><span class="peeklabel">🌾</span><div class="peekcards">${opp.hand.map(c => tileHTML(keyOf(cardEls(c)))).join('')}</div></div>`   // 🌾 Meadow: their hand flips face up
      : `<div class="backs" aria-label="${opp.handCount} cards in hand">${'<span class="back"></span>'.repeat(opp.handCount)}</div>`}
    <div class="opphold" title="${esc(opp.name)}'s Hold slot">👖${opp.held ? tileHTML(keyOf(opp.held.els)) : opp.hasHeld ? '<span class="back"></span>' : '<span class="ohempty"></span>'}</div>
    ${document.fullscreenEnabled ? `<button class="iconbtn" data-act="fullscreen" title="Full screen" aria-label="Full screen">⛶</button>` : ''}
    <div class="roundtag ${v.overtime?'ot':''}">${label}${v.power && !v.over ? ' <span class="powertag">⚡×1.5</span>' : ''}</div>
  </header>`;
  h += arenaHTML(v) + historyHTML(v);
  // bottom: you
  const items = frozen ? [] : handItems(you);
  const count = frozen ? you.hand.length : items.length;
  const hint = v.over ? '' : v.reviewing ? 'Check the results, then press Continue.' : v.countdown > 0 ? 'Get ready…' : v.youLocked ? 'Locked in!' : (you.tiredAtk || you.tiredDef) ? '😮‍💨 Tired: singles only in that slot' : 'Drop a card on another to merge';
  h += `<footer class="tbar me-bar">
    <div class="me-info"><div class="who" id="nm-you">${you.name === 'You' ? 'You' : esc(you.name)}</div>${bars(you,'you')}${chips(you)}<div class="count">${hint} <b>(${count}/${HAND} cards)</b></div>${!frozen && !you.discardUsed ? `<button class="minibtn" data-act="discardall" title="Once per game: throw away your hand and draw 5 new cards">${ui.confirmDiscard ? '🗑️ Tap again to confirm' : '🗑️ New hand (once)'}</button>` : ''}</div>
    <div class="hand dropzone-hand" data-dropzone="hand">${frozen ? you.hand.map(e => cardFace(e, cardEls(e))).join('') : items.map(id => itemCard(you, id, '', id.includes('+') ? '' : `data-dropzone="item" data-target="${id}"`)).join('')}</div>
    ${v.over ? '' : pocketHTML(v)}
  </footer>`;
  // pop-ups over the board
  if (!frozen && you.regrow && v.discard.length && ui.picked && !isDiscard(ui.picked)){
    h += `<button class="gardenchip" data-act="unpick" title="Close the card info to open Garden">🌱 Garden</button>`;   // shrinks while a card's info is open
  } else if (!frozen && you.regrow && v.discard.length){
    const uniq = [...new Set(v.discard)], full = you.hand.length >= HAND;
    h += `<div class="popover regrowbox"><b>🌱 Garden:</b> tap a card to see its combos, then drag it into your hand${full ? ' (onto a card to swap it out, since your hand is full)' : ''}.
      <div class="row" style="margin-top:6px">${uniq.map(e => cardFace(e,[e],'mini ' + (ui.picked === 'D:'+e ? 'sel' : ''),true,`data-drag="D:${e}" data-act="pickitem" data-id="D:${e}" aria-label="${EL[e].name} from the discard pile"`)).join('')}</div>
      ${ui.picked && isDiscard(ui.picked) ? `<div class="gardeninfo">${helperHTML(you)}</div>` : ''}</div>`;
  }
  if (!frozen && ui.picked && !isDiscard(ui.picked)) h += `<div class="popover helperpop anchored" style="visibility:hidden">${helperHTML(you)}</div>`;
  if (ui.msg) h += `<div class="flash toast" role="status">${esc(ui.msg)}</div>`;
  if (v.disconnected) h += `<div class="flash toast">Your opponent disconnected. Press ✕ to go back to the menu.</div>`;
  if (v.over){
    const txt = v.result === 'win' ? 'You win! 🏆' : v.result === 'lose' ? `${esc(opp.name)} wins` : (v.doubleKO ? "It's a tie 🤝" : "It's a draw 🤝");
    let why;
    if (v.doubleKO){
      const d = v.doubleKO;
      why = `💥 Double knockout! Both fighters fell at the same moment, so the bigger final hit decides it. You dealt ${d.you}, ${esc(opp.name)} dealt ${d.opp}.` +
        (v.result === 'win' ? ' Your hit was stronger!' : v.result === 'lose' ? ' Their hit was stronger.' : ' Exactly equal, so it’s a tie.');
    } else why = v.reason === 'ko' ? 'Knockout! Health reached zero.' : 'Final health decided it.';
    // A slim winner banner at the top of the arena, so the final blow stays visible underneath.
    h += `<div class="overbanner over" role="status"><div class="big ${v.result}">${txt}</div><p>${why} Final health: you ${Math.max(0,you.hp)}, ${esc(opp.name)} ${Math.max(0,opp.hp)}.</p></div>`;
  }
  h += `<div class="rotate" role="alert"><div class="rotbox"><div class="rotic">📱↻</div><b>Please turn your phone sideways</b><p>Elemental Battle is played in landscape.</p></div></div>`;
  h += `</div>`;
  $app.innerHTML = h;
  placeHint();
}
// Put the card hint just above the card you tapped, sliding it sideways if it would cover the Ready button.
function placeHint(){
  const pop = document.querySelector('.helperpop.anchored'); if (!pop) return;
  const card = document.querySelector(`.board [data-act="pickitem"][data-id="${ui.picked}"]`);
  const board = document.querySelector('.board').getBoundingClientRect();
  if (!card){ pop.classList.remove('anchored'); pop.style.visibility = ''; return; }
  const c = card.getBoundingClientRect(), w = pop.offsetWidth, gap = 8;
  pop.style.maxHeight = Math.max(120, c.top - board.top - 56) + 'px';
  const hgt = Math.min(pop.scrollHeight, parseFloat(pop.style.maxHeight));
  let left = c.left + c.width / 2 - w / 2;
  left = Math.max(board.left + 8, Math.min(left, board.right - w - 8));
  const top = c.top - hgt - gap;
  const ready = document.querySelector('.readyrow .rb:last-child');
  if (ready){
    const r = ready.getBoundingClientRect();
    const overlaps = !(left + w < r.left || left > r.right || top + hgt < r.top || top > r.bottom);
    if (overlaps){
      const toLeft = r.left - gap - w, toRight = r.right + gap;
      if (toLeft >= board.left + 8) left = toLeft; else if (toRight + w <= board.right - 8) left = toRight;
    }
  }
  pop.style.left = (left - board.left) + 'px'; pop.style.top = (top - board.top) + 'px';
  pop.style.visibility = '';
}
window.addEventListener('resize', () => { if (screen === 'game') placeHint(); });
let toastText = '';
function render(){
  document.body.classList.toggle('ingame', screen === 'game' && !!view);
  // Messages on the board fade away by themselves after a few seconds.
  if (ui && ui.msg && ui.msg !== toastText){ toastText = ui.msg; const t = ui.msg; setTimeout(() => { if (ui.msg === t){ ui.msg = ''; toastText = ''; if (screen === 'game') render(); } }, 3500); }
  if (ui && !ui.msg) toastText = '';
  if (screen === 'menu') renderMenu(); else if (screen === 'lobby') renderLobby();
  else if (view){ renderGame(); if (fxPending && screen === 'game'){ const q = fxPending; fxPending = null; playFx(q); } revealAnim = false; }
}
document.addEventListener('toggle', e => { if (e.target.classList && e.target.classList.contains('what')) whatOpen = e.target.open; }, true);

// ---------- input: taps ----------
let suppressClick = false;
document.addEventListener('click', e => {
  if (suppressClick){ suppressClick = false; return; }
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const act = b.dataset.act, you = view && view.you;
  if (act === 'ai'){ ctrl = localController('ai', [myName || 'You', `Computer (${b.dataset.level})`], b.dataset.level); screen = 'game'; ctrl.push(); return; }
  if (act === 'host') return hostGame();
  if (act === 'join') return joinGame(document.getElementById('code').value);
  if (act === 'menu') return toMenu();
  if (act === 'fullscreen'){
    const el = document.documentElement;
    if (document.fullscreenElement) document.exitFullscreen();
    else if (el.requestFullscreen) el.requestFullscreen().then(() => screen && window.screen.orientation && window.screen.orientation.lock && window.screen.orientation.lock('landscape').catch(() => {})).catch(() => {});
    return;
  }
  if (act === 'rematch') return ctrl.rematch();
  if (act === 'regrowtake'){ const el = b.dataset.el; resetPicks(); return ctrl.doRegrow(el); }
  if (!you) return;
  if (act === 'continue'){ if (view.reviewing && !view.youAck) ctrl.ackMe(); return; }
  if (view.reviewing) return;
  if (view.youLocked && act !== 'ready') return;
  ui.msg = '';
  if (act === 'split'){ e.stopPropagation(); splitItem(b.dataset.id); }
  else if (act === 'pickitem'){
    const id = b.dataset.id;
    if (isDiscard(id)){ ui.picked = ui.picked === id ? null : id; render(); return; }
    if (playedIds().includes(id) || id === ui.hold){ unplace(id); ui.picked = id; }
    else ui.picked = ui.picked === id ? null : id;
  }
  else if (act === 'mergewith'){ ui.msg = mergeItems(you, ui.picked, b.dataset.id); }
  else if (act === 'place' || act === 'zone'){
    if (ui.picked && (b.dataset.zone === 'atk' || b.dataset.zone === 'def') && isMeadow(you, ui.picked)){ const m = useMeadow(you, ui.picked); if (m) ui.msg = m; }
    else if (ui.picked) ui.msg = placeItem(you, ui.picked, b.dataset.zone);
  }
  else if (act === 'unpick') ui.picked = null;
  else if (act === 'discardall'){
    if (!ui.confirmDiscard){ ui.confirmDiscard = true; ui.msg = '🗑️ Tap again to throw away your whole hand and draw 5 new cards (once per game).'; }
    else { resetPicks(); ctrl.doDiscard(); return; }
  }
  else if (act === 'ready'){
    if (view.countdown > 0) return;
    if (view.youLocked) return;                    // Ready is final
    const mv = buildMove(); if (playedIds().length && validMove(you, mv)) ctrl.move(mv); return;
  }
  render();
});
document.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.split')){ e.preventDefault(); e.target.click(); } });

// ---------- input: drag and drop (mouse and touch) ----------
let drag = null;
document.addEventListener('pointerdown', e => {
  const el = e.target.closest('[data-drag]');
  if (!el || el.disabled || e.button > 0 || e.target.closest('.split') || !view || view.youLocked || view.reviewing) return;
  drag = { id:el.dataset.drag, el, x:e.clientX, y:e.clientY, started:false, ghost:null, over:null };
});
document.addEventListener('pointermove', e => {
  if (!drag) return;
  if (!drag.started){
    if (Math.hypot(e.clientX - drag.x, e.clientY - drag.y) < 8) return;
    drag.started = true;
    const r = drag.el.getBoundingClientRect(), g = drag.el.cloneNode(true);
    g.classList.add('ghost'); g.style.width = r.width + 'px'; g.style.height = r.height + 'px';
    drag.w = r.width; drag.h = r.height; document.body.appendChild(g); drag.ghost = g;
    drag.el.classList.add('dragging'); document.body.classList.add('is-dragging');
  }
  e.preventDefault();
  drag.cx = e.clientX; drag.cy = e.clientY;
  if (!drag.scrolling){ drag.scrolling = true; requestAnimationFrame(autoScroll); }
  drag.ghost.style.transform = `translate(${e.clientX - drag.w/2}px, ${e.clientY - drag.h/2}px) rotate(-4deg)`;
  const t = dropTarget(e.clientX, e.clientY, drag.id);
  if (drag.over && drag.over !== t) drag.over.classList.remove('drop-hover');
  if (t) t.classList.add('drop-hover'); drag.over = t;
}, { passive:false });
// While dragging near the top or bottom edge, scroll the page so far-away drop zones come into reach.
function autoScroll(){
  if (!drag || !drag.started){ return; }
  const edge = 70, y = drag.cy;
  let dy = 0;
  if (y < edge) dy = -Math.ceil((edge - y) / 5);
  else if (y > innerHeight - edge) dy = Math.ceil((y - (innerHeight - edge)) / 5);
  if (dy){
    window.scrollBy(0, dy);
    const t = dropTarget(drag.cx, drag.cy, drag.id);
    if (drag.over && drag.over !== t) drag.over.classList.remove('drop-hover');
    if (t) t.classList.add('drop-hover'); drag.over = t;
  }
  requestAnimationFrame(autoScroll);
}
function dropTarget(x, y, id){
  const el = document.elementFromPoint(x, y); if (!el) return null;
  const t = el.closest('[data-dropzone]'); if (!t || !t.dataset.dropzone) return null;
  if (t.dataset.dropzone === 'item' && t.dataset.target === id) return null;
  return t;
}
function endDrag(e){
  if (!drag) return;
  const d = drag; drag = null;
  if (!d.started) return;
  d.ghost.remove();
  const t = dropTarget(e.clientX, e.clientY, d.id), you = view.you; ui.msg = '';   // find the drop spot while pop-ups are still hidden
  document.body.classList.remove('is-dragging');
  suppressClick = true; setTimeout(() => { suppressClick = false; }, 0);
  if (!t && isDiscard(d.id)){ ui.msg = 'Drag it into your hand to take it.'; render(); return; }
  if (t && isDiscard(d.id)){
    const el = d.id.slice(2), z = t.dataset.dropzone, full = you.hand.length >= HAND;
    if (z === 'item' && full){
      const target = t.dataset.target;
      if (/^\d+$/.test(target)){ resetPicks(); ctrl.doRegrow(el, +target); return; }
      ui.msg = 'Drop it onto a single card in your hand to swap.';
    } else if (z === 'hand' || z === 'item'){
      if (full) ui.msg = 'Your hand is full: drop it onto the card you want to throw away.';
      else { resetPicks(); ctrl.doRegrow(el); return; }
    } else ui.msg = 'Drag it into your hand to take it.';
    render(); return;
  }
  if (t){
    const z = t.dataset.dropzone;
    if ((z === 'atk' || z === 'def') && isMeadow(you, d.id)){ const m = useMeadow(you, d.id); if (m) ui.msg = m; }
    else if (z === 'atk' || z === 'def' || z === 'hold') ui.msg = placeItem(you, d.id, z);
    else if (z === 'item') ui.msg = mergeItems(you, d.id, t.dataset.target);
    else if (z === 'hand'){
      if (d.id === 'H' && !ui.unheld){
        if (handItems(you).length >= HAND) ui.msg = 'Your hand is full (5 cards). Merge two cards or put one in the arena to make room.';
        else { unplace('H'); ui.unheld = true; }
      } else unplace(d.id);
      ui.picked = null;
    }
  }
  render();
}
document.addEventListener('pointerup', endDrag);
// Stop the browser's own picture-dragging from hijacking our card drags.
document.addEventListener('dragstart', e => { if (e.target.closest && e.target.closest('[data-drag]')) e.preventDefault(); });
document.addEventListener('pointercancel', e => { if (drag && drag.ghost) drag.ghost.remove(); document.body.classList.remove('is-dragging'); drag = null; render(); });
render();
</script>
</body></html>
